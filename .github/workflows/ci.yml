name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: EarthReadyCore unit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: swift test (EarthReadyCore)
        working-directory: EarthReadyCore
        run: swift test --enable-code-coverage

      - name: Coverage report
        working-directory: EarthReadyCore
        run: |
          set -euo pipefail
          BIN_PATH="$(swift build --show-bin-path)"
          XCTEST_BUNDLE="$(find "$BIN_PATH" -name '*.xctest' -maxdepth 1)"
          BINARY="$XCTEST_BUNDLE/Contents/MacOS/$(basename "$XCTEST_BUNDLE" .xctest)"
          xcrun llvm-cov report \
            "$BINARY" \
            -instr-profile="$BIN_PATH/codecov/default.profdata" \
            Sources/EarthReadyCore/

  app-build:
    name: App build (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: xcodebuild
        run: |
          set -euo pipefail
          xcodebuild -scheme EarthReadyMXFinal \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            build
